<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — CampusConnect 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page narrow">

  <header class="topbar">
    <a class="brand" href="index.html">CampusConnect<span class="brand-year">2026</span></a>
  </header>

  <main class="form-main">
    <div class="ic-card form-card">
      <div class="pin-row"></div>
      <h1>Log in</h1>
      <p class="form-sub">Enter your email or student ID to continue.</p>

      <form action="login.php" method="POST" novalidate>

        <div class="field">
          <label for="identifier">Email or student ID</label>
          <input type="text" id="identifier" name="identifier" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn primary full">Log in</button>
      </form>

      <p class="switch-link">New here? <a href="register.html">Register</a></p>
    </div>
  </main>

</div>
</body>
</html>
